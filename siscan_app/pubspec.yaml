name: siscan
description: "SISCAN — Secado Inteligente de Café"
publish_to: 'none'
version: 0.2.1+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.0.10
  home_widget: ^0.10.0
  geolocator: ^14.0.0
  http: ^1.6.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Sistema de diseño SISCAN v2: iconos y paisaje exportados del paquete (tools/exportar_svg_sistema.mjs) y la marca.
  assets:
    - assets/sistema/iconos/
    - assets/sistema/paisaje/
    - assets/sistema/marca/
  # Outfit (display) y Plus Jakarta Sans (ui), variables, licencia SIL OFL (assets/fonts/nuevas/*-OFL.txt).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/nuevas/Outfit.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/nuevas/PlusJakartaSans.ttf
